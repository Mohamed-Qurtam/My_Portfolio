<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404: Packet Dropped // Mohamed Qurtam</title>
  <meta name="description" content="404 Error: The requested security route or asset was dropped by the perimeter firewall policy.">
  <meta name="robots" content="noindex, follow">

  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230e1012'/%3E%3Cpath d='M32 10 14 17v14c0 12 8 19 18 23 10-4 18-11 18-23V17L32 10z' fill='none' stroke='%234dbb8a' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M24 31.5l6 6 11-11' fill='none' stroke='%234dbb8a' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="index.css">

  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: clamp(2rem, 5vw, 4rem) 1.5rem;
      position: relative;
      background: radial-gradient(circle at center, rgba(77, 187, 138, 0.05) 0%, transparent 70%), var(--bg-primary);
    }
    .error-code {
      font-family: var(--font-mono);
      font-size: clamp(4rem, 12vw, 8rem);
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
      letter-spacing: -0.05em;
      margin-bottom: 0.5rem;
      text-shadow: 0 0 30px var(--accent-glow);
    }
    .error-status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 1rem;
      border-radius: 999px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      letter-spacing: 0.06em;
      margin-bottom: 1.5rem;
    }
    .error-title {
      font-size: clamp(1.4rem, 3vw, 2rem);
      color: var(--text-primary);
      margin-bottom: 1rem;
      max-width: 550px;
    }
    .error-desc {
      font-size: 1rem;
      color: var(--text-secondary);
      max-width: 480px;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .error-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
    }
  </style>
</head>

<body>
  <div class="error-page">
    <div class="error-code">404</div>
    <div class="error-status">
      <span style="color:#ef4444;">●</span> DROP_ACTION: ROUTE_NOT_FOUND
    </div>
    <h1 class="error-title">Packet Dropped: Unrecognized Route</h1>
    <p class="error-desc">
      The requested endpoint does not match any valid route in the network security topology. Check the URL destination or return to the main console.
    </p>
    <div class="error-actions">
      <a href="/" class="btn-primary" id="returnHomeBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        Return to Home Console
      </a>
      <a href="/#projects" class="btn-secondary">View Projects</a>
      <a href="/#contact" class="btn-secondary">Report Issue</a>
    </div>
  </div>
</body>
</html>
